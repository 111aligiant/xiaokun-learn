name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:course
      - run: npm run test:qa
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm i --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: 启动预览并跑 E2E
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/preview.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:4173/ > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:4173/ > /dev/null || (cat /tmp/preview.log && exit 1)
          npm run test:e2e
